<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#0f2e22">
  <title>Mot de passe — Portail Scolaire</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/theme.css">
</head>
<body>
<div class="public">
  <header>
    <a class="brand" href="/" style="text-decoration:none;color:inherit"><div class="logo">PS</div><div><div class="name">Portail Scolaire</div></div></a>
    <div data-lang-switch></div>
  </header>
  <main>
    <div class="card auth-card">
      <form id="forgot-form" class="hidden">
        <h1 data-fr="Mot de passe oublié" data-en="Forgot password"></h1>
        <p class="muted" data-fr="Indiquez votre identifiant ou votre email : si un email est enregistré sur votre compte, vous recevrez un lien valable 1 heure. Sinon, demandez un nouveau mot de passe à la direction." data-en="Enter your username or email: if an email is registered on your account, you will receive a link valid for 1 hour. Otherwise, ask the administration for a new password."></p>
        <div class="field"><label for="code" data-fr="Code de l'établissement" data-en="School code"></label><input id="code" required maxlength="30"></div>
        <div class="field"><label for="ident" data-fr="Identifiant ou email" data-en="Username or email"></label><input id="ident" required></div>
        <div id="err1" class="error-msg" role="alert"></div>
        <button class="btn btn-primary btn-block" type="submit" data-fr="Envoyer le lien" data-en="Send the link"></button>
      </form>
      <form id="reset-form" class="hidden">
        <h1 data-fr="Nouveau mot de passe" data-en="New password"></h1>
        <div class="field"><label for="pw1" data-fr="Nouveau mot de passe (8 caractères minimum)" data-en="New password (min. 8 characters)"></label><input id="pw1" type="password" minlength="8" required autocomplete="new-password"></div>
        <div class="field"><label for="pw2" data-fr="Confirmer" data-en="Confirm"></label><input id="pw2" type="password" minlength="8" required autocomplete="new-password"></div>
        <div id="err2" class="error-msg" role="alert"></div>
        <button class="btn btn-primary btn-block" type="submit" data-fr="Enregistrer" data-en="Save"></button>
      </form>
      <div id="done" class="hidden center"><h2 id="done-title"></h2><p class="muted" id="done-text"></p><a class="btn btn-primary" href="/" data-fr="Retour à la connexion" data-en="Back to sign in"></a></div>
    </div>
  </main>
</div>
<script type="module" src="/js/reset.js"></script>
</body>
</html>
